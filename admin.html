<style>
  :root{
    --bg:#faf6ef;
    --bg-alt:#f2e9db;
    --surface:#ffffff;
    --ink:#120e0a;
    --ink-soft:#3d2f22;
    --ink-mute:#55462f;
    --wine:#7d2c40;
    --wine-light:#a8455d;
    --gold:#8a6429;
    --error:#7d2c40;
    --line:rgba(43,32,24,0.12);
    --on-accent:#f7f1e6;
    --maxw:880px;
  }
  [data-theme="dark"]{
    --bg:#1b1410;
    --bg-alt:#211913;
    --surface:#2a1f18;
    --ink:#f4ece1;
    --ink-soft:#cdbeaa;
    --ink-mute:#a3907a;
    --wine:#7d2c40;
    --wine-light:#a8455d;
    --gold:#c9a468;
    --error:#e0899d;
    --line:rgba(244,236,225,0.12);
    --on-accent:#f4ece1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  p{margin:0;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px;}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    gap:6px;
  }
  .logo-img{
    width:76px;
    height:76px;
    border-radius:22%;
    margin-bottom:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .logo-img-sm{width:40px; height:40px; border-radius:22%; margin-bottom:8px; box-shadow:none;}
  .login-screen p.sub{color:var(--ink-mute); margin-bottom:28px;}
  .login-box{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:280px;
  }
  input[type="password"], input[type="email"]{
    width:100%;
    padding:13px 16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
  }
  input[type="password"]:focus, input[type="email"]:focus{outline:none; border-color:var(--gold);}
  .btn{
    padding:13px 16px;
    border-radius:8px;
    border:none;
    background:var(--wine);
    color:var(--on-accent);
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease;
  }
  .btn:hover{background:var(--wine-light);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-weight:500;
  }
  .btn-ghost:hover{border-color:var(--gold); color:var(--gold);}
  .btn-google{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .btn-google:hover{border-color:var(--gold);}
  .btn-google svg{flex-shrink:0;}
  .login-divider{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--ink-mute);
    font-size:0.8rem;
    margin:2px 0;
  }
  .login-divider::before, .login-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .login-error{color:var(--error); font-size:0.85rem; margin-top:4px;}
  .theme-toggle{
    position:fixed;
    top:20px;
    right:20px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:border-color .2s ease, color .2s ease;
  }
  .theme-toggle:hover{border-color:var(--gold); color:var(--gold);}
  .theme-toggle .icon-moon{display:none;}
  [data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  [data-theme="dark"] .theme-toggle .icon-moon{display:block;}

  /* ---------- Panel ---------- */
  .panel{padding:32px 0 60px;}
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:28px;
  }
  .panel-head h1{font-size:1.5rem; margin-top:4px;}
  .panel-user{color:var(--ink-mute); font-size:0.82rem; margin-top:6px;}
  .panel-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  select{
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
  }
  .btn-sm{padding:10px 16px; font-size:0.88rem;}

  .estado{color:var(--ink-mute); font-size:0.92rem; padding:20px 0;}

  .grupo-fecha{margin-bottom:28px;}
  .grupo-fecha-titulo{
    font-family:'Fraunces', serif;
    font-style:italic;
    color:var(--gold);
    font-size:1.05rem;
    margin-bottom:12px;
    text-transform:capitalize;
  }
  .reserva-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .reserva-hora{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
    color:var(--ink);
    min-width:64px;
  }
  .reserva-info{flex:1; min-width:180px;}
  .reserva-servicio{font-weight:600; color:var(--ink);}
  .reserva-nombre{color:var(--ink-soft); font-size:0.92rem; margin-top:2px;}
  .reserva-email{color:var(--ink-mute); font-size:0.85rem; margin-top:2px;}
  .reserva-derecha{display:flex; align-items:center; gap:10px;}
  .btn-editar{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Work Sans', sans-serif;
    font-size:0.8rem;
    padding:7px 12px;
    border-radius:99px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .2s ease, color .2s ease;
  }
  .btn-editar:hover{border-color:var(--gold); color:var(--gold);}
  .btn-cancelar{
    background:transparent;
    border:1px solid var(--line);
    color:var(--error);
    font-family:'Work Sans', sans-serif;
    font-size:0.8rem;
    padding:7px 12px;
    border-radius:99px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .2s ease, background .2s ease;
  }
  .btn-cancelar:hover{border-color:var(--error); background:var(--bg);}
  .vacio{
    text-align:center;
    color:var(--ink-mute);
    padding:60px 20px;
    font-size:0.95rem;
  }
  [hidden]{display:none !important;}

  /* ---------- Agregar turno ---------- */
  .turno-dialog{
    width:min(420px, calc(100vw - 40px));
    max-height:min(88vh, 720px);
    overflow-y:auto;
    padding:28px;
    border:1px solid var(--line);
    border-radius:16px;
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 24px 64px rgba(0,0,0,0.45);
  }
  .turno-dialog::backdrop{
    background:rgba(10,7,5,0.72);
    backdrop-filter:blur(2px);
  }
  .turno-dialog-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:20px;
  }
  .turno-dialog-title{font-family:'Fraunces', serif; font-size:1.25rem;}
  .turno-close{
    flex-shrink:0;
    width:32px;
    height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:1.1rem;
    line-height:1;
  }
  .turno-close:hover{border-color:var(--gold); color:var(--gold);}
  .turno-form{display:flex; flex-direction:column; gap:14px;}
  .turno-form label{
    display:block;
    font-size:0.82rem;
    color:var(--ink-mute);
    margin-bottom:6px;
  }
  .turno-form select, .turno-form input[type="text"], .turno-form input[type="email"], .turno-form input[type="date"], .turno-form input[type="time"]{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:0.92rem;
  }
  .turno-form select:focus, .turno-form input:focus{outline:none; border-color:var(--gold);}
  .turno-fila{display:flex; gap:12px;}
  .turno-fila > div{flex:1; min-width:0;}
  @media (max-width:380px){
    .turno-fila{flex-direction:column; gap:14px;}
  }
  .turno-error{color:var(--error); font-size:0.85rem;}

  @media (max-width:600px){
    .reserva-card{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>

<script>
(function(){
  // --- Misma configuración de Firebase que usa el sitio principal ---
  var firebaseConfig = {
    apiKey: "AIzaSyA8ZXqiHSecv90s-uksw-b08FF0QCAKm4Q",
    authDomain: "nails-fd3fa.firebaseapp.com",
    projectId: "nails-fd3fa",
    storageBucket: "nails-fd3fa.firebasestorage.app",
    messagingSenderId: "129964287525",
    appId: "1:129964287525:web:e7f0ff231b7f89bb2601cc"
  };

  // ---------- Modo oscuro ----------
  var THEME_KEY = 'marbella_theme';
  var themeToggle = document.getElementById('theme-toggle');
  if (themeToggle){
    themeToggle.addEventListener('click', function(){
      var esOscuro = document.documentElement.getAttribute('data-theme') === 'dark';
      if (esOscuro){
        document.documentElement.removeAttribute('data-theme');
        themeToggle.setAttribute('aria-label', 'Cambiar a modo oscuro');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.setAttribute('aria-label', 'Cambiar a modo claro');
      }
      try { localStorage.setItem(THEME_KEY, esOscuro ? 'light' : 'dark'); } catch (err) { /* localStorage no disponible */ }
    });
    if (document.documentElement.getAttribute('data-theme') === 'dark'){
      themeToggle.setAttribute('aria-label', 'Cambiar a modo claro');
    }
  }

  var auth = null;
  var db = null;
  if (window.firebase){
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (err) { /* Firebase no disponible */ }
  }

  var loginScreen = document.getElementById('login-screen');
  var panel = document.getElementById('panel');
  var emailInput = document.getElementById('login-email');
  var passwordInput = document.getElementById('login-password');
  var btnEntrar = document.getElementById('btn-entrar');
  var btnGoogle = document.getElementById('btn-google');
  var loginError = document.getElementById('login-error');
  var panelUser = document.getElementById('panel-user');
  var btnSalir = document.getElementById('btn-salir');
  var filtroRango = document.getElementById('filtro-rango');
  var btnRefrescar = document.getElementById('btn-refrescar');
  var estadoCarga = document.getElementById('estado-carga');
  var listaReservas = document.getElementById('lista-reservas');
  var btnAgregar = document.getElementById('btn-agregar');
  var turnoDialog = document.getElementById('turno-dialog');
  var turnoDialogTitle = document.getElementById('turno-dialog-title');
  var turnoClose = document.getElementById('turno-close');
  var turnoForm = document.getElementById('turno-form');
  var turnoCategoria = document.getElementById('turno-categoria');
  var turnoServicio = document.getElementById('turno-servicio');
  var turnoFecha = document.getElementById('turno-fecha');
  var turnoHora = document.getElementById('turno-hora');
  var turnoNombre = document.getElementById('turno-nombre');
  var turnoEmail = document.getElementById('turno-email');
  var turnoError = document.getElementById('turno-error');
  var turnoSubmit = document.getElementById('turno-submit');

  function parseISODate(value){
    var parts = value.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function toISODate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  // ---------- Agregar turno manual ----------
  var SERVICIOS = {
    'Manicuría': [
      { nombre: "Semipermanente", duracion: 60 },
      { nombre: "Nivelación / Kapping", duracion: 90 },
      { nombre: "Extensiones Softgel", duracion: 120 },
      { nombre: "Polygel", duracion: 120 },
      { nombre: "Press On", duracion: 30 }
    ],
    'Cosmetología': [
      { nombre: "Limpieza básica", duracion: 45 },
      { nombre: "Limpieza profunda", duracion: 60 },
      { nombre: "Personalizado", duracion: 60 }
    ]
  };

  function toMinutes(hhmm){
    var parts = hhmm.split(':').map(Number);
    return parts[0] * 60 + parts[1];
  }

  function seSolapan(inicioA, duracionA, inicioB, duracionB){
    return inicioA < (inicioB + duracionB) && inicioB < (inicioA + duracionA);
  }

  function renderTurnoServicios(servicioPreseleccionado){
    var lista = SERVICIOS[turnoCategoria.value] || [];
    turnoServicio.innerHTML = lista.map(function(s){
      return '<option value="' + s.nombre + '" data-duracion="' + s.duracion + '">' + s.nombre + '</option>';
    }).join('');
    if (servicioPreseleccionado) turnoServicio.value = servicioPreseleccionado;
  }

  function categoriaDeServicio(nombreServicio){
    for (var cat in SERVICIOS){
      if (SERVICIOS[cat].some(function(s){ return s.nombre === nombreServicio; })) return cat;
    }
    return 'Manicuría';
  }

  if (turnoCategoria){
    turnoCategoria.addEventListener('change', function(){ renderTurnoServicios(); });
    renderTurnoServicios();
  }

  var editandoId = null;

  function abrirTurnoDialog(item){
    turnoForm.reset();
    editandoId = item ? item.id : null;

    if (item){
      var r = item.datos;
      turnoCategoria.value = categoriaDeServicio(r.servicio);
      renderTurnoServicios(r.servicio);
      turnoFecha.value = r.fecha;
      turnoHora.value = r.hora;
      turnoNombre.value = r.nombre || '';
      turnoEmail.value = r.email || '';
      turnoDialogTitle.textContent = 'Editar turno';
      turnoSubmit.textContent = 'Guardar cambios';
    } else {
      turnoCategoria.value = 'Manicuría';
      renderTurnoServicios();
      turnoFecha.value = toISODate(new Date());
      turnoDialogTitle.textContent = 'Agregar turno manual';
      turnoSubmit.textContent = 'Guardar turno';
    }

    turnoError.hidden = true;
    if (typeof turnoDialog.showModal === 'function') turnoDialog.showModal();
  }

  if (btnAgregar) btnAgregar.addEventListener('click', function(){ abrirTurnoDialog(); });
  if (turnoClose) turnoClose.addEventListener('click', function(){ turnoDialog.close(); });
  if (turnoDialog){
    turnoDialog.addEventListener('click', function(e){
      if (e.target === turnoDialog) turnoDialog.close();
    });
  }

  if (turnoForm){
    turnoForm.addEventListener('submit', function(e){
      e.preventDefault();
      turnoError.hidden = true;

      var servicio = turnoServicio.value;
      var opcionSel = turnoServicio.selectedOptions[0];
      var duracion = opcionSel ? Number(opcionSel.dataset.duracion) : null;
      var fecha = turnoFecha.value;
      var hora = turnoHora.value;
      var nombre = turnoNombre.value.trim();
      var email = turnoEmail.value.trim();

      if (!servicio || !duracion || !fecha || !hora || !nombre){
        turnoError.textContent = 'Completá servicio, fecha, hora y nombre.';
        turnoError.hidden = false;
        return;
      }

      var idActual = editandoId;
      var textoBoton = idActual ? 'Guardar cambios' : 'Guardar turno';
      turnoSubmit.disabled = true;
      turnoSubmit.textContent = 'Guardando…';

      db.collection('reservas').where('fecha', '==', fecha).get()
        .then(function(snapshot){
          var inicioMin = toMinutes(hora);
          var choca = false;
          snapshot.forEach(function(doc){
            if (idActual && doc.id === idActual) return; // no comparar el turno contra sí mismo
            var d = doc.data();
            if (d.hora && d.duracion && seSolapan(inicioMin, duracion, toMinutes(d.hora), d.duracion)){
              choca = true;
            }
          });
          if (choca && !confirm('Ese horario se superpone con otra reserva ese día. ¿Igual querés guardarlo?')){
            return Promise.reject({ cancelado: true });
          }

          var datos = { fecha: fecha, hora: hora, duracion: duracion, servicio: servicio, nombre: nombre };
          if (email) datos.email = email;

          if (idActual){
            return db.collection('reservas').doc(idActual).update(datos);
          }
          datos.creado = firebase.firestore.FieldValue.serverTimestamp();
          return db.collection('reservas').add(datos);
        })
        .then(function(){
          turnoDialog.close();
          cargarReservas();
        })
        .catch(function(err){
          if (err && err.cancelado) return;
          console.warn('No se pudo guardar el turno:', err);
          turnoError.textContent = 'No se pudo guardar el turno. Probá de nuevo.';
          turnoError.hidden = false;
        })
        .finally(function(){
          turnoSubmit.disabled = false;
          turnoSubmit.textContent = textoBoton;
        });
    });
  }

  // ---------- Login con Firebase Authentication (email/contraseña o Google) ----------
  var CORREO_PERMITIDO = 'enzovillalba665@gmail.com';

  var MENSAJES_ERROR = {
    'auth/invalid-email': 'Ese email no es válido.',
    'auth/user-not-found': 'No existe una cuenta con ese email.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Email o contraseña incorrectos.',
    'auth/too-many-requests': 'Demasiados intentos — esperá un momento y probá de nuevo.',
    'auth/popup-blocked': 'El navegador bloqueó la ventana de Google — permití los pop-ups e intentá de nuevo.'
  };

  function intentarEntrar(){
    if (!auth) return;
    loginError.hidden = true;
    btnEntrar.disabled = true;

    auth.signInWithEmailAndPassword(emailInput.value.trim(), passwordInput.value)
      .catch(function(err){
        loginError.textContent = MENSAJES_ERROR[err.code] || 'No se pudo iniciar sesión.';
        loginError.hidden = false;
        passwordInput.value = '';
      })
      .finally(function(){
        btnEntrar.disabled = false;
      });
  }

  function intentarEntrarGoogle(){
    if (!auth) return;
    loginError.hidden = true;
    btnGoogle.disabled = true;

    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .catch(function(err){
        var msg = MENSAJES_ERROR[err.code];
        if (msg){
          loginError.textContent = msg;
          loginError.hidden = false;
        }
      })
      .finally(function(){
        btnGoogle.disabled = false;
      });
  }

  btnEntrar.addEventListener('click', intentarEntrar);
  [emailInput, passwordInput].forEach(function(input){
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        e.preventDefault();
        intentarEntrar();
      }
    });
  });
  btnGoogle.addEventListener('click', intentarEntrarGoogle);

  btnSalir.addEventListener('click', function(){
    if (auth) auth.signOut();
  });

  if (auth){
    auth.onAuthStateChanged(function(user){
      if (user && user.email !== CORREO_PERMITIDO){
        auth.signOut();
        loginError.textContent = 'Esta cuenta no tiene acceso a este panel.';
        loginError.hidden = false;
        return;
      }
      if (user){
        loginScreen.hidden = true;
        panel.hidden = false;
        panelUser.textContent = 'Conectada como ' + user.email;
        cargarReservas();
      } else {
        detenerListenerReservas();
        panel.hidden = true;
        loginScreen.hidden = false;
        emailInput.focus();
      }
    });
  } else {
    loginError.textContent = 'No se pudo conectar con Firebase.';
    loginError.hidden = false;
  }

  // ---------- Listado de reservas (en vivo) ----------
  var reservasCache = [];
  var unsubscribeReservas = null;

  function cargarReservas(){
    if (!db){
      estadoCarga.textContent = 'No se pudo conectar con la base de datos.';
      return;
    }

    if (unsubscribeReservas) return; // el listener ya está activo, no hace falta suscribirse de nuevo

    estadoCarga.hidden = false;
    estadoCarga.textContent = 'Cargando reservas…';
    listaReservas.innerHTML = '';

    unsubscribeReservas = db.collection('reservas').onSnapshot(function(snapshot){
      var reservas = [];
      snapshot.forEach(function(doc){
        var d = doc.data();
        if (d.fecha && d.hora) reservas.push({ id: doc.id, datos: d });
      });
      reservasCache = reservas;
      renderReservas(reservasCache);
    }, function(err){
      estadoCarga.textContent = 'No se pudieron cargar las reservas. Probá actualizar de nuevo.';
      console.warn('Error al escuchar reservas:', err);
    });
  }

  function detenerListenerReservas(){
    if (unsubscribeReservas){
      unsubscribeReservas();
      unsubscribeReservas = null;
    }
  }

  function cancelarReserva(id, btn){
    if (!confirm('¿Cancelar y borrar esta reserva?')) return;
    btn.disabled = true;
    btn.textContent = 'Borrando…';

    db.collection('reservas').doc(id).delete()
      .then(function(){ cargarReservas(); })
      .catch(function(err){
        console.warn('No se pudo cancelar la reserva:', err);
        btn.disabled = false;
        btn.textContent = 'Cancelar';
        alert('No se pudo cancelar la reserva. Probá de nuevo.');
      });
  }

  function renderReservas(reservas){
    var hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    var hoyISO = toISODate(hoy);
    var filtro = filtroRango.value;

    reservas = reservas.filter(function(item){
      var r = item.datos;
      if (filtro === 'todas') return true;
      if (filtro === 'hoy') return r.fecha === hoyISO;
      // 'proximas': hoy en adelante
      return r.fecha >= hoyISO;
    });

    reservas.sort(function(a, b){
      var ra = a.datos, rb = b.datos;
      if (ra.fecha !== rb.fecha) return ra.fecha < rb.fecha ? -1 : 1;
      return ra.hora < rb.hora ? -1 : (ra.hora > rb.hora ? 1 : 0);
    });

    estadoCarga.hidden = true;
    listaReservas.innerHTML = '';

    if (reservas.length === 0){
      listaReservas.innerHTML = '<p class="vacio">No hay reservas para este filtro.</p>';
      return;
    }

    var fechaActual = null;
    var grupo = null;

    reservas.forEach(function(item){
      var r = item.datos;

      if (r.fecha !== fechaActual){
        fechaActual = r.fecha;
        grupo = document.createElement('div');
        grupo.className = 'grupo-fecha';

        var titulo = document.createElement('p');
        titulo.className = 'grupo-fecha-titulo';
        var fechaFormateada = parseISODate(r.fecha).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
        titulo.textContent = r.fecha === hoyISO ? 'Hoy — ' + fechaFormateada : fechaFormateada;
        grupo.appendChild(titulo);

        listaReservas.appendChild(grupo);
      }

      var card = document.createElement('div');
      card.className = 'reserva-card';

      var izquierda = document.createElement('div');
      izquierda.className = 'reserva-hora';
      izquierda.textContent = r.hora;

      var info = document.createElement('div');
      info.className = 'reserva-info';
      info.innerHTML =
        '<div class="reserva-servicio">' + (r.servicio || 'Sin especificar') + '</div>' +
        '<div class="reserva-nombre">' + (r.nombre || '') + '</div>' +
        (r.email ? '<div class="reserva-email">' + r.email + '</div>' : '');

      var derecha = document.createElement('div');
      derecha.className = 'reserva-derecha';

      var btnEditar = document.createElement('button');
      btnEditar.type = 'button';
      btnEditar.className = 'btn-editar';
      btnEditar.textContent = 'Editar';
      btnEditar.addEventListener('click', function(){
        abrirTurnoDialog(item);
      });
      derecha.appendChild(btnEditar);

      var btnCancelar = document.createElement('button');
      btnCancelar.type = 'button';
      btnCancelar.className = 'btn-cancelar';
      btnCancelar.textContent = 'Cancelar';
      btnCancelar.addEventListener('click', function(){
        cancelarReserva(item.id, btnCancelar);
      });
      derecha.appendChild(btnCancelar);

      card.appendChild(izquierda);
      card.appendChild(info);
      card.appendChild(derecha);
      grupo.appendChild(card);
    });
  }

  filtroRango.addEventListener('change', function(){
    if (!panel.hidden) renderReservas(reservasCache);
  });
  btnRefrescar.addEventListener('click', function(){
    renderReservas(reservasCache);
  });
})();
</script>

</body>
